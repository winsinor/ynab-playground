[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ynab-amazon-tool"
version = "0.1.0"
description = "Enriches unapproved YNAB Amazon transactions with item-level memos from Gmail"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
ynab-amazon-tool = "ynab_amazon_tool.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_amazon_tool"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
